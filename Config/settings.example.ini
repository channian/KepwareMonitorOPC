[OPC]
# 多台 Kepware Server，格式: 名稱|opc.tcp://IP:Port
# 多台以逗號分隔
Servers = kepware_a|opc.tcp://192.168.1.10:49320,
          kepware_b|opc.tcp://10.0.0.5:49320

# 向下相容：若只有一台，可以用 ServerUrl（Servers 優先）
# ServerUrl = opc.tcp://192.168.1.10:49320

# OPC UA 安全設定
# SecurityPolicy: None, Basic256Sha256, Basic256, Basic128Rsa15
SecurityPolicy = None
# SecurityMode: None, Sign, SignAndEncrypt
SecurityMode = None
# Authentication: anonymous, username
Authentication = anonymous
# 若 Authentication = username，需設定以下帳密
# Username = your_username
# Password = your_password

[Mail]
SmtpServer = smtp.example.com
Port = 25
From = kepware-monitor@example.com
# 全域收件人（所有派報都會寄）
To = it-admin@example.com
Cc =
Subject = Kepware 設備監控通知

[Monitor]
# 監控間隔（秒）
intervalSeconds = 600
# CSV 重載檢查間隔（秒）
csvReloadSeconds = 30
# 持續異常時，重複派報的間隔（秒）
alertResendInterval = 1800

[Tags]
File = Config/tags.csv

[Database]
# SQLite 資料庫路徑
Path = data/monitor.db

[Log]
LogPath = logs
Debug = True
