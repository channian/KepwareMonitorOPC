[OPC]
# 多台 Kepware Server，格式: 名稱|opc.tcp://IP:Port
# 多台以逗號分隔
Servers = kepware_a|opc.tcp://192.168.1.10:49320,
          kepware_b|opc.tcp://10.0.0.5:49320

# 向下相容：若只有一台，可以用 ServerUrl（Servers 優先）
# ServerUrl = opc.tcp://192.168.1.10:49320

# OPC UA 安全設定
# SecurityPolicy: None, Basic256Sha256, Basic256, Basic128Rsa15
SecurityPolicy = None
# SecurityMode: None, Sign, SignAndEncrypt
SecurityMode = None
# Authentication: anonymous, username
Authentication = anonymous
# 若 Authentication = username，需設定以下帳密
# Username = your_username
# Password = your_password

[Mail]
SmtpServer = smtp.example.com
Port = 25
From = kepware-monitor@example.com
# 全域收件人（所有派報都會寄）
To = it-admin@example.com
Cc =
Subject = Kepware 設備監控通知

[Monitor]
# 監控間隔（秒）
intervalSeconds = 600
# CSV 重載檢查間隔（秒）
csvReloadSeconds = 30
# 持續異常時，重複派報的間隔（秒）
alertResendInterval = 1800
# 動態閥值：回看歷史筆數（用於計算移動平均和標準差）
DynamicWindow = 24
# 動態閥值：預設 k 值（幾倍標準差），CSV 可覆蓋
DynamicK = 3.0

[Tags]
File = Config/tags.csv

[Database]
# SQLite 資料庫路徑
Path = data/monitor.db

[Log]
LogPath = logs
Debug = True

[WebUI]
# 是否啟用 Web UI 管理介面（true / false）
Enable = false
# 監聽位址（0.0.0.0 = 所有網卡）
Host = 0.0.0.0
# 監聽 Port
Port = 8080

[Webhook]
# 是否啟用 Webhook 推播（異常/復歸時呼叫外部 API）
Enable = false
# API endpoint URL
Url = https://your-company-api.com/notify
# Token（由公司內部通訊平台申請，在 BodyTemplate 中用 {{$token}} 引用）
Token = your_token_here
# 請求逾時秒數
Timeout = 10
# Body 模板（JSON 格式），支援 {{$變數}} 替換
# 可用變數: token, server_name, device_name, value, threshold, condition,
#           counter, accumulate, diagnostic, message, timestamp, status
# 變數名稱可含底線，如 {{$_message}}
# 範例（Token 放 Body + push_para 傳遞推播內容）:
BodyTemplate = {"token": "{{$token}}", "push_para": {"message": "{{$message}}"}}
# SSL 憑證驗證（公司內網 API 使用自簽憑證時設 false）
VerifySSL = false
# 是否使用 Proxy（false = 直連，不走系統 Proxy；適用於公司內網 API）
UseProxy = false
# 指定 Proxy URL（UseProxy = true 時有效，留空則用系統預設 Proxy）
# 範例: http://proxy.company.com:8080
ProxyUrl =

# ===== Kepware Event Log 監控 =====
# 每台 Kepware 各有獨立的 API Gateway，對應一個 section：
#   單台：[KepwareLog] + ServerName = kepware_a
#   多台：[KepwareLog.kepware_a], [KepwareLog.kepware_b], ...
# section 名稱中 "." 後面的部分即為 server_name

[KepwareLog.kepware_a]
# 是否啟用
Enable = false
# Kepware API Gateway 位址
ApiBaseUrl = http://192.168.1.10:8000
# API Gateway 帳號密碼（JWT 認證）
Username = admin
Password = your_password
# 派報主旨（獨立於 [Mail] Subject，避免與設備監控混淆）
EventSubject = Kepware 事件監控通知
# 輪詢間隔（秒）
PollInterval = 600

# ---- 事件嚴重等級分類（依 message 關鍵字）----
# Critical（嚴重）：物理斷線/斷電 → 立即派報
SeverityCritical = Device not responding
# Warning（警告）：通訊擁塞/連線過載 → 自適應閥值
SeverityWarning = Timeout,Add item failed
# Advisory（建議）：系統資源未釋放 → 僅記錄不派報
SeverityAdvisory = Failed to remove item

# ---- 自適應閥值（Warning severity 使用）----
# 學習窗口（天）
AdaptiveBaselineDays = 7
# 倍數（超過基準線 × 倍數才告警）
AdaptiveMultiplier = 3.0
# 最低門檻（即使基準很低也不會低於此值）
AdaptiveMinThreshold = 3

# ---- 固定閥值（Unclassified 事件使用）----
# Channel 異常：累積視窗（秒）
ChannelAlertWindow = 3600
# Channel 異常：視窗內累積次數達此門檻則派報
ChannelAlertThreshold = 5
# Tag 讀取異常：連續失敗次數達此門檻則派報
TagErrorConsecutive = 6

# ---- 其他 ----
# 關鍵字即時告警（逗號分隔，不分嚴重等級，命中即立即派報）
CriticalKeywords = Runtime stopped,License error,Server shutdown
# 資料保留天數（超過自動清理）
RetentionDays = 90

# 第二台範例（取消註解即可啟用）
# [KepwareLog.kepware_b]
# Enable = false
# ApiBaseUrl = http://10.0.0.5:8000
# Username = admin
# Password = your_password
