<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepware Monitor - 登入</title>
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <div class="card-ui" style="width:100%;max-width:400px;padding:32px;">
        <div style="text-align:center;margin-bottom:28px;">
            <svg viewBox="0 0 64 64" style="width:56px;height:56px;margin:0 auto 12px;">
                <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5"/>
                <text x="32" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="20" fill="#e6edf7" letter-spacing="-0.02em">KPM</text>
                <circle class="logo-pulse" cx="50" cy="50" r="4" fill="#22d3ee"/>
            </svg>
            <div style="font-size:20px;font-weight:700;color:var(--fg-1);">Kepware Monitor</div>
            <div style="font-size:13px;color:var(--fg-3);margin-top:4px;">請登入以繼續</div>
        </div>

        {% if error %}
        <div class="alert-banner a-err show" style="margin-bottom:16px;">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label class="form-label">帳號</label>
                <input type="text" class="input w-full input-sans" id="username" name="username"
                       placeholder="請輸入帳號" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">密碼</label>
                <input type="password" class="input w-full" id="password" name="password"
                       placeholder="請輸入密碼" required>
            </div>
            <button type="submit" class="btn btn-primary w-full" style="justify-content:center;padding:12px;">
                登入
            </button>
        </form>
    </div>
</body>
</html>
