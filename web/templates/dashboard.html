{% extends "base.html" %}
{% block title %}狀態看板 - Kepware Monitor{% endblock %}
{% block nav_dashboard %}active{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-speedometer2"></i> 狀態看板</h4>
    <div class="d-flex align-items-center gap-3">
        <span id="lastUpdate" class="text-muted small"></span>
        <span id="sseStatus" class="badge bg-secondary">連線中...</span>
    </div>
</div>

<!-- 連線狀態 -->
<div class="row mb-3" id="connectionCards">
    <!-- 動態產生 -->
</div>

<!-- 統計摘要 -->
<div class="row mb-3">
    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body py-2">
                <div class="text-muted small">總監控點數</div>
                <div class="fs-4 fw-bold" id="totalDevices">-</div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body py-2">
                <div class="text-muted small">正常</div>
                <div class="fs-4 fw-bold text-success" id="normalCount">-</div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body py-2">
                <div class="text-muted small">異常</div>
                <div class="fs-4 fw-bold text-danger" id="alertCount">-</div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body py-2">
                <div class="text-muted small">停用</div>
                <div class="fs-4 fw-bold text-secondary" id="disabledCount">-</div>
            </div>
        </div>
    </div>
</div>

<!-- 設備列表 -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <span>監控設備</span>
            <span class="text-muted small" id="devicePageInfo"></span>
        </div>
        <div class="d-flex align-items-center gap-2">
            <div class="input-group input-group-sm" style="width:250px;">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="deviceSearch" placeholder="搜尋名稱 / Server ..."
                       oninput="onDeviceSearch()">
                <button class="btn btn-outline-secondary" type="button"
                        onclick="document.getElementById('deviceSearch').value='';onDeviceSearch();">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <button class="btn btn-sm btn-outline-secondary" onclick="filterDevices('all')">全部</button>
            <button class="btn btn-sm btn-outline-danger" onclick="filterDevices('alert')">異常</button>
            <button class="btn btn-sm btn-outline-success" onclick="filterDevices('normal')">正常</button>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-hover table-sm mb-0">
            <thead class="table-light">
                <tr>
                    <th style="width:40px">狀態</th>
                    <th>設備名稱</th>
                    <th>Server</th>
                    <th>類型</th>
                    <th>條件</th>
                    <th>閾值</th>
                    <th>累積</th>
                    <th>診斷</th>
                </tr>
            </thead>
            <tbody id="deviceTableBody">
                <tr>
                    <td colspan="8" class="text-center text-muted">載入中...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 分頁 -->
<div class="d-flex justify-content-end mt-2">
    <nav>
        <ul class="pagination pagination-sm mb-0" id="devicePagination"></ul>
    </nav>
</div>
{% endblock %}

{% block scripts %}
<script>
var allDevices = [];
var currentFilter = 'all';
var deviceSearchKw = '';
var devicePage = 1;
var devicePageSize = 50;

// 初始載入
fetchStatus();

// SSE 即時更新
var evtSource = new EventSource('/api/dashboard/sse');
evtSource.onmessage = function(event) {
    var data = JSON.parse(event.data);
    updateDashboard(data);
    document.getElementById('sseStatus').className = 'badge bg-success';
    document.getElementById('sseStatus').textContent = '即時連線';
};
evtSource.onerror = function() {
    document.getElementById('sseStatus').className = 'badge bg-danger';
    document.getElementById('sseStatus').textContent = '連線中斷';
};

function fetchStatus() {
    fetch('/api/dashboard/status')
        .then(function(r) { return r.json(); })
        .then(function(data) { updateDashboard(data); })
        .catch(function(err) { console.error('Failed to fetch status:', err); });
}

function updateDashboard(data) {
    // 更新時間
    document.getElementById('lastUpdate').textContent = '最後更新: ' + data.timestamp;

    // 連線狀態卡片
    var connDiv = document.getElementById('connectionCards');
    var connHtml = '';
    for (var name in (data.connections || {})) {
        var info = data.connections[name];
        var color = info.connected ? 'success' : 'danger';
        var icon = info.connected ? 'bi-check-circle-fill' : 'bi-x-circle-fill';
        var status = info.connected ? '已連線' : '斷線';
        connHtml +=
            '<div class="col-auto">' +
                '<div class="card border-' + color + '">' +
                    '<div class="card-body py-2 px-3 d-flex align-items-center gap-2">' +
                        '<i class="bi ' + icon + ' text-' + color + '"></i>' +
                        '<span class="fw-bold">' + name + '</span>' +
                        '<span class="badge bg-' + color + '">' + status + '</span>' +
                    '</div>' +
                '</div>' +
            '</div>';
    }
    connDiv.innerHTML = connHtml;

    // 設備資料
    allDevices = data.devices || [];

    // 統計
    var enabled = allDevices.filter(function(d) { return d.enable; });
    var alertDevices = enabled.filter(function(d) { return d.is_alert; });
    var normalDevices = enabled.filter(function(d) { return !d.is_alert; });
    var disabled = allDevices.filter(function(d) { return !d.enable; });

    document.getElementById('totalDevices').textContent = allDevices.length;
    document.getElementById('normalCount').textContent = normalDevices.length;
    document.getElementById('alertCount').textContent = alertDevices.length;
    document.getElementById('disabledCount').textContent = disabled.length;

    renderDeviceTable();
}

function getFilteredDevices() {
    var list = allDevices;

    // 狀態篩選
    if (currentFilter === 'alert') {
        list = list.filter(function(d) { return d.enable && d.is_alert; });
    } else if (currentFilter === 'normal') {
        list = list.filter(function(d) { return d.enable && !d.is_alert; });
    }

    // 搜尋
    if (deviceSearchKw) {
        var kw = deviceSearchKw.toLowerCase();
        list = list.filter(function(d) {
            return (d.name && d.name.toLowerCase().indexOf(kw) >= 0) ||
                   (d.server_name && d.server_name.toLowerCase().indexOf(kw) >= 0) ||
                   (d.diagnostic && d.diagnostic.toLowerCase().indexOf(kw) >= 0);
        });
    }

    return list;
}

function filterDevices(filter) {
    currentFilter = filter;
    devicePage = 1;
    renderDeviceTable();
}

function onDeviceSearch() {
    deviceSearchKw = document.getElementById('deviceSearch').value.trim();
    devicePage = 1;
    renderDeviceTable();
}

function renderDeviceTable() {
    var filtered = getFilteredDevices();
    var totalPages = Math.max(1, Math.ceil(filtered.length / devicePageSize));
    if (devicePage > totalPages) devicePage = totalPages;

    var start = (devicePage - 1) * devicePageSize;
    var pageItems = filtered.slice(start, start + devicePageSize);

    // 頁面資訊
    var info = document.getElementById('devicePageInfo');
    if (deviceSearchKw) {
        info.textContent = '(搜尋: ' + filtered.length + ' / ' + allDevices.length + ' 筆)';
    } else if (currentFilter !== 'all') {
        info.textContent = '(' + filtered.length + ' 筆)';
    } else {
        info.textContent = '';
    }

    var tbody = document.getElementById('deviceTableBody');
    if (pageItems.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">無資料</td></tr>';
        renderDevicePagination(totalPages);
        return;
    }

    var html = '';
    for (var idx = 0; idx < pageItems.length; idx++) {
        var d = pageItems[idx];
        var statusIcon, statusClass;
        if (!d.enable) {
            statusIcon = '<i class="bi bi-dash-circle text-secondary"></i>';
            statusClass = 'table-light text-muted';
        } else if (d.is_alert) {
            statusIcon = '<i class="bi bi-exclamation-triangle-fill text-danger"></i>';
            statusClass = 'table-danger';
        } else {
            statusIcon = '<i class="bi bi-check-circle-fill text-success"></i>';
            statusClass = '';
        }

        html +=
            '<tr class="' + statusClass + '">' +
                '<td class="text-center">' + statusIcon + '</td>' +
                '<td>' + d.name + '</td>' +
                '<td>' + d.server_name + '</td>' +
                '<td><span class="badge bg-info">' + d.device_type + '</span></td>' +
                '<td>' + (d.condition || '-') + '</td>' +
                '<td>' + (d.threshold || '-') + '</td>' +
                '<td>' + d.counter + '/' + d.accumulate + '</td>' +
                '<td class="small">' + (d.diagnostic || '-') + '</td>' +
            '</tr>';
    }
    tbody.innerHTML = html;
    renderDevicePagination(totalPages);
}

function renderDevicePagination(totalPages) {
    var ul = document.getElementById('devicePagination');
    if (totalPages <= 1) { ul.innerHTML = ''; return; }

    var html = '';
    html += '<li class="page-item ' + (devicePage === 1 ? 'disabled' : '') + '">' +
        '<a class="page-link" href="#" onclick="goDevicePage(' + (devicePage - 1) + ');return false;">&laquo;</a></li>';

    var startP = Math.max(1, devicePage - 2);
    var endP = Math.min(totalPages, startP + 4);
    if (endP - startP < 4) startP = Math.max(1, endP - 4);

    for (var p = startP; p <= endP; p++) {
        html += '<li class="page-item ' + (p === devicePage ? 'active' : '') + '">' +
            '<a class="page-link" href="#" onclick="goDevicePage(' + p + ');return false;">' + p + '</a></li>';
    }

    html += '<li class="page-item ' + (devicePage === totalPages ? 'disabled' : '') + '">' +
        '<a class="page-link" href="#" onclick="goDevicePage(' + (devicePage + 1) + ');return false;">&raquo;</a></li>';
    ul.innerHTML = html;
}

function goDevicePage(p) {
    var filtered = getFilteredDevices();
    var totalPages = Math.max(1, Math.ceil(filtered.length / devicePageSize));
    if (p < 1 || p > totalPages) return;
    devicePage = p;
    renderDeviceTable();
}
</script>
{% endblock %}
