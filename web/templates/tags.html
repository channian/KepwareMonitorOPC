{% extends "base.html" %}
{% block title %}Tags 管理 - Kepware Monitor{% endblock %}
{% block nav_tags %}active{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-tags"></i> Tags 管理</h4>
    <div>
        <input type="file" id="csvFileInput" accept=".csv" class="d-none" onchange="handleCsvUpload(this)">
        <button class="btn btn-outline-secondary btn-sm" onclick="document.getElementById('csvFileInput').click()">
            <i class="bi bi-upload"></i> 匯入 CSV
        </button>
        <button class="btn btn-outline-secondary btn-sm" onclick="exportCsv()">
            <i class="bi bi-download"></i> 匯出 CSV
        </button>
        <button class="btn btn-success btn-sm" onclick="addRow()">
            <i class="bi bi-plus-lg"></i> 新增設備
        </button>
        <button class="btn btn-primary btn-sm" onclick="saveTags()">
            <i class="bi bi-save"></i> 儲存
        </button>
    </div>
</div>

<div id="saveAlert" class="alert d-none mb-3"></div>

<div class="card">
    <div class="table-responsive">
        <table class="table table-hover table-sm mb-0" id="tagsTable">
            <thead class="table-light">
                <tr id="tagsHeader">
                    <th style="width:40px">操作</th>
                </tr>
            </thead>
            <tbody id="tagsBody">
                <tr><td class="text-center text-muted">載入中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="mt-2 text-muted small">
    提示: 修改後請按「儲存」，CSV 會在下一次重載週期自動生效（無須重啟監控程式）
</div>
{% endblock %}

{% block scripts %}
<script>
let tagHeaders = [];
let tagRows = [];

loadTags();

function loadTags() {
    fetch('/api/tags')
        .then(r => r.json())
        .then(data => {
            tagHeaders = data.headers || [];
            tagRows = data.rows || [];
            renderTable();
        });
}

function renderTable() {
    // Header
    const headerRow = document.getElementById('tagsHeader');
    let hHtml = '<th style="width:40px">操作</th>';
    for (const h of tagHeaders) {
        hHtml += `<th class="small">${h}</th>`;
    }
    headerRow.innerHTML = hHtml;

    // Body
    const tbody = document.getElementById('tagsBody');
    if (tagRows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="' + (tagHeaders.length + 1) + '" class="text-center text-muted">無資料</td></tr>';
        return;
    }

    let html = '';
    for (let i = 0; i < tagRows.length; i++) {
        html += '<tr>';
        html += `<td>
            <button class="btn btn-outline-danger btn-sm py-0 px-1" onclick="deleteRow(${i})" title="刪除">
                <i class="bi bi-trash"></i>
            </button>
        </td>`;
        for (const h of tagHeaders) {
            const val = tagRows[i][h] || '';
            const width = h === 'NodeId' ? 'min-width:280px' : h === 'Name' ? 'min-width:150px' : 'min-width:80px';
            html += `<td><input type="text" class="form-control form-control-sm" style="${width}"
                     value="${escapeHtml(val)}" data-row="${i}" data-col="${h}"
                     onchange="updateCell(${i}, '${h}', this.value)"></td>`;
        }
        html += '</tr>';
    }
    tbody.innerHTML = html;
}

function updateCell(row, col, value) {
    tagRows[row][col] = value;
}

function addRow() {
    const newRow = {};
    for (const h of tagHeaders) {
        newRow[h] = '';
    }
    // 預設值
    newRow['Enable'] = 'TRUE';
    newRow['Type'] = 'number';
    newRow['CountNeeded'] = '1';
    tagRows.push(newRow);
    renderTable();
}

function deleteRow(index) {
    if (!confirm('確定要刪除此筆設備嗎?')) return;
    tagRows.splice(index, 1);
    renderTable();
}

function saveTags() {
    fetch('/api/tags', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({headers: tagHeaders, rows: tagRows}),
    })
    .then(r => r.json())
    .then(data => {
        if (data.ok) {
            showAlert('saveAlert', 'success', '儲存成功 (' + data.count + ' 筆)');
        } else {
            showAlert('saveAlert', 'danger', '儲存失敗: ' + (data.error || '未知錯誤'));
        }
    })
    .catch(err => {
        showAlert('saveAlert', 'danger', '儲存失敗: ' + err);
    });
}

function handleCsvUpload(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const text = e.target.result;
        const parsed = parseCsv(text);
        if (parsed.headers.length === 0) {
            showAlert('saveAlert', 'danger', 'CSV 解析失敗：找不到欄位標題');
            return;
        }
        tagHeaders = parsed.headers;
        tagRows = parsed.rows;
        renderTable();
        showAlert('saveAlert', 'warning',
            '已匯入 ' + parsed.rows.length + ' 筆資料（尚未儲存），請確認後按「儲存」');
    };
    reader.readAsText(file, 'UTF-8');
    input.value = '';
}

function parseCsv(text) {
    const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
    if (lines.length === 0) return { headers: [], rows: [] };

    const headers = parseCsvLine(lines[0]);
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const values = parseCsvLine(line);
        const row = {};
        for (let j = 0; j < headers.length; j++) {
            row[headers[j]] = values[j] || '';
        }
        rows.push(row);
    }
    return { headers, rows };
}

function parseCsvLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQuotes) {
            if (ch === '"' && line[i + 1] === '"') {
                current += '"';
                i++;
            } else if (ch === '"') {
                inQuotes = false;
            } else {
                current += ch;
            }
        } else {
            if (ch === '"') {
                inQuotes = true;
            } else if (ch === ',') {
                result.push(current);
                current = '';
            } else {
                current += ch;
            }
        }
    }
    result.push(current);
    return result;
}

function exportCsv() {
    if (tagHeaders.length === 0) return;
    let csv = tagHeaders.join(',') + '\n';
    for (const row of tagRows) {
        const values = tagHeaders.map(h => {
            const val = row[h] || '';
            return val.includes(',') || val.includes('"') || val.includes('\n')
                ? '"' + val.replace(/"/g, '""') + '"' : val;
        });
        csv += values.join(',') + '\n';
    }
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tags.csv';
    a.click();
    URL.revokeObjectURL(url);
}

function showAlert(id, type, msg) {
    const el = document.getElementById(id);
    el.className = 'alert alert-' + type + ' mb-3';
    el.textContent = msg;
    el.classList.remove('d-none');
    if (type !== 'warning') setTimeout(() => el.classList.add('d-none'), 3000);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML.replace(/"/g, '&quot;');
}
</script>
{% endblock %}
