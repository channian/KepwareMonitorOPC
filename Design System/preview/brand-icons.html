<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_shell.css"><title>Iconography</title>
<style>
.grid { display:grid; grid-template-columns: repeat(8, 1fr); gap: 12px; }
.ic { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 14px 8px; display:flex; flex-direction:column; align-items:center; gap: 8px; }
.ic svg { width: 22px; height: 22px; color: #e6edf7; }
.ic .lbl { font-size: 10px; color: #64748b; font-family: var(--font-mono); text-align:center; }
.ic.accent svg { color: #22d3ee; }
.sizes { display:flex; gap: 20px; align-items: baseline; margin-top:16px; padding: 14px; background:#0f172a; border:1px solid #1e293b; border-radius:8px; }
.sz { display:flex; align-items:center; gap:6px; color:#94a3b8; font-size:11px; font-family: var(--font-mono); }
.sz svg { color:#22d3ee; }
</style></head>
<body><div class="card">
