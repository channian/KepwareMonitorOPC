<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_shell.css"><title>Spacing Scale</title>
<style>
.row { display:grid; grid-template-columns: 60px 1fr 60px; align-items:center; gap: 12px; margin-bottom: 8px; }
.label { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
.bar { height: 14px; background: linear-gradient(90deg, #22d3ee, rgba(34,211,238,0.3)); border-radius: 3px; }
</style></head>
<body><div class="card">
  <div class="cap" style="margin-bottom:12px">Spacing scale · 4px base</div>
  <div class="row"><div class="label">sp-1</div><div class="bar" style="width:4px"></div><div class="label" style="text-align:right">4</div></div>
  <div class="row"><div class="label">sp-2</div><div class="bar" style="width:8px"></div><div class="label" style="text-align:right">8</div></div>
  <div class="row"><div class="label">sp-3</div><div class="bar" style="width:12px"></div><div class="label" style="text-align:right">12</div></div>
  <div class="row"><div class="label">sp-4</div><div class="bar" style="width:16px"></div><div class="label" style="text-align:right">16</div></div>
  <div class="row"><div class="label">sp-5</div><div class="bar" style="width:20px"></div><div class="label" style="text-align:right">20</div></div>
  <div class="row"><div class="label">sp-6</div><div class="bar" style="width:24px"></div><div class="label" style="text-align:right">24</div></div>
  <div class="row"><div class="label">sp-7</div><div class="bar" style="width:32px"></div><div class="label" style="text-align:right">32</div></div>
  <div class="row"><div class="label">sp-8</div><div class="bar" style="width:48px"></div><div class="label" style="text-align:right">48</div></div>
  <div class="row"><div class="label">sp-9</div><div class="bar" style="width:64px"></div><div class="label" style="text-align:right">64</div></div>
</div></body></html>
