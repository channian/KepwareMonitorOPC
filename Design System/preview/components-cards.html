<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_shell.css"><title>Cards</title>
<style>
.grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.c { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 18px; transition: all 200ms; }
.c:hover { border-color: #293548; box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.3); }
.c-head { display:flex; align-items:center; gap: 8px; margin-bottom: 12px; }
.c-title { font-size: 11px; color:#94a3b8; text-transform:uppercase; letter-spacing:0.08em; font-weight:600; }
.c-icon { color:#22d3ee; }
.c-metric { font-family: var(--font-mono); font-size: 28px; font-weight: 600; color: #e6edf7; font-variant-numeric: tabular-nums; letter-spacing:-0.01em; }
.c-delta { font-family: var(--font-mono); font-size: 12px; margin-top: 4px; }
.c-active { border-color: rgba(34,211,238,0.35); box-shadow: 0 0 0 1px rgba(34,211,238,0.2), 0 0 20px rgba(34,211,238,0.1); }
</style></head>
<body><div class="card">
  <div class="cap" style="margin-bottom:12px">Cards · metric cards + hover state · active glow</div>
  <div class="grid">
    <div class="c">
      <div class="c-head">
        <svg class="c-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
        <span class="c-title">Active Devices</span>
      </div>
      <div class="c-metric">142</div>
      <div class="c-delta" style="color:#22c55e">▲ 2 since 14:00</div>
    </div>
    <div class="c c-active">
      <div class="c-head">
        <svg class="c-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="c-title" style="color:#22d3ee">Active Alerts</span>
      </div>
      <div class="c-metric" style="color:#ef4444">3</div>
      <div class="c-delta" style="color:#f59e0b">1 new in last 5 min</div>
    </div>
    <div class="c">
      <div class="c-head">
        <svg class="c-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span class="c-title">Poll interval</span>
      </div>
      <div class="c-metric">600<span style="font-size:14px; color:#94a3b8; margin-left:4px">s</span></div>
      <div class="c-delta" style="color:#94a3b8">next read in 04:12</div>
    </div>
  </div>
</div></body></html>
