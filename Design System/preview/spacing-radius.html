<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_shell.css"><title>Radius Scale</title>
<style>
.grid { display:grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.tile { height: 80px; background: var(--bg-2); border: 1px solid var(--border-2); display:flex; align-items:flex-end; padding: 8px 10px; font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); }
.tile strong { color: var(--fg-1); font-weight: 600; font-size: 11px; font-family: var(--font-mono); }
</style></head>
<body><div class="card">
  <div class="cap" style="margin-bottom:12px">Corner radii</div>
  <div class="grid">
    <div class="tile" style="border-radius:4px"><div><strong>xs</strong><br>4px</div></div>
    <div class="tile" style="border-radius:6px"><div><strong>sm</strong><br>6px</div></div>
    <div class="tile" style="border-radius:10px"><div><strong>md</strong><br>10px</div></div>
    <div class="tile" style="border-radius:14px"><div><strong>lg</strong><br>14px</div></div>
    <div class="tile" style="border-radius:20px"><div><strong>xl</strong><br>20px</div></div>
    <div class="tile" style="border-radius:999px"><div><strong>pill</strong><br>999</div></div>
  </div>
  <div style="font-size:12px; color:var(--fg-2); margin-top:10px">inputs 6 · buttons 6 · cards 10–14 · pills 999</div>
</div></body></html>
