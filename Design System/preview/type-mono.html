<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_shell.css"><title>Type — Mono &amp; Metrics</title></head>
<body><div class="card">
  <div style="display:grid; gap:18px;">
    <div>
      <div class="cap" style="margin-bottom:8px">Metric display · JetBrains Mono 32 / 600 · tabular</div>
      <div style="display:flex; gap:24px; align-items:baseline">
        <div class="t-metric" style="color:var(--ok)">42.7<span style="font-size:16px; color:var(--fg-2); margin-left:4px">°C</span></div>
        <div class="t-metric" style="color:var(--warn)">1,284</div>
        <div class="t-metric" style="color:var(--err)">-03.1</div>
      </div>
    </div>
    <div>
      <div class="cap" style="margin-bottom:6px">Mono body · 13 / 400 · identifiers / logs</div>
      <div class="t-mono">ns=2;s=Channel1.iFIX1._System._SecondsSinceLastError</div>
      <div class="t-mono" style="color:var(--fg-2); margin-top:4px">192.168.2.50:49310 · threshold: less &lt; 60</div>
    </div>
    <div>
      <div class="cap" style="margin-bottom:6px">Timestamp · mono 13</div>
      <div class="t-mono" style="color:var(--fg-2)">2026-04-19 14:32:07</div>
    </div>
  </div>
</div></body></html>
