<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_shell.css"><title>Buttons</title>
<style>
.btn { padding: 9px 18px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; font-family: inherit; display: inline-flex; align-items: center; gap: 7px; transition: all 200ms cubic-bezier(0.4,0,0.2,1); }
.btn:hover { transform: translateY(-1px); }
.b-primary { background: #3b82f6; color: #fff; box-shadow: 0 0 0 1px rgba(59,130,246,0.3), 0 0 16px rgba(59,130,246,0.2); }
.b-primary:hover { background: #2563eb; box-shadow: 0 0 0 1px rgba(59,130,246,0.4), 0 0 24px rgba(59,130,246,0.3); }
.b-accent { background: #22d3ee; color: #03181c; box-shadow: 0 0 0 1px rgba(34,211,238,0.25), 0 0 20px rgba(34,211,238,0.15); }
.b-success { background: #22c55e; color: #052e16; }
.b-danger { background: #ef4444; color: #fff; }
.b-outline { background: transparent; color: #22d3ee; border: 1.5px solid #22d3ee; }
.b-ghost { background: transparent; color: #94a3b8; border: 1.5px solid #293548; }
.b-ghost:hover { color: #e6edf7; border-color: #3b4a66; }
.b-sm { padding: 6px 12px; font-size: 13px; }
.b-disabled { opacity: 0.4; cursor: not-allowed; }
svg { width: 16px; height: 16px; }
.row { display:flex; flex-wrap:wrap; gap: 10px; margin-bottom: 12px; align-items:center; }
</style></head>
<body><div class="card">
  <div class="cap" style="margin-bottom:10px">Buttons · hover lifts 1px + glow</div>
  <div class="row">
    <button class="btn b-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>測試連線</button>
    <button class="btn b-accent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>開始新增</button>
    <button class="btn b-success">Approve</button>
    <button class="btn b-danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>開始刪除</button>
  </div>
  <div class="row">
    <button class="btn b-outline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>匯出 CSV</button>
    <button class="btn b-ghost">取消</button>
    <button class="btn b-primary b-sm">Small</button>
    <button class="btn b-primary b-disabled">Disabled</button>
  </div>
</div></body></html>
